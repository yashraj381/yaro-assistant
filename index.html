<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yaro Live Talk</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  text-align: center;
}

.container {
  background: #1e293b;
  padding: 20px;
  border-radius: 15px;
  width: 90%;
  max-width: 400px;
}

h1 {
  margin-bottom: 10px;
}

#response {
  margin-top: 15px;
  font-size: 16px;
}

.circle {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: #3b82f6;
  margin: 20px auto;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); opacity: 0.8; }
  50% { transform: scale(1.2); opacity: 0.4; }
  100% { transform: scale(1); opacity: 0.8; }
}

button {
  padding: 10px 20px;
  border: none;
  border-radius: 20px;
  background: #3b82f6;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
  <h1>Yaro 🎙️</h1>
  <div class="circle"></div>
  <p id="response">Yaro: main yahin hoon 🙂</p>
  <button onclick="startYaro()">Start Talking</button>
</div>

<script>

// ===== GLOBAL =====
let selectedVoice = null;
let isListening = false;
let isSpeaking = false;
let recognition;

// ===== MEMORY =====
function saveName(name) {
  localStorage.setItem("yaro_name", name);
}
function getName() {
  return localStorage.getItem("yaro_name");
}

// ===== EMOTION =====
function detectEmotion(text) {
  text = text.toLowerCase();
  if (text.includes("sad") || text.includes("dukhi") || text.includes("mood off"))
    return "sad";
  if (text.includes("happy") || text.includes("khush"))
    return "happy";
  return "normal";
}

// ===== VOICE LOAD =====
function loadVoices() {
  const voices = speechSynthesis.getVoices();
  selectedVoice = voices.find(v => v.lang.includes("hi")) || voices[0];
}

// ===== SPEAK =====
function speak(text, emotion = "normal") {
  isSpeaking = true;

  const speech = new SpeechSynthesisUtterance(text);
  speech.voice = selectedVoice;
  speech.lang = "hi-IN";

  speech.pitch = emotion === "happy" ? 1.3 : (emotion === "sad" ? 0.8 : 1);
  speech.rate = emotion === "sad" ? 0.85 : 1;

  speech.onend = () => {
    isSpeaking = false;
    startListening();
  };

  speechSynthesis.cancel();
  speechSynthesis.speak(speech);
}

// ===== LISTEN =====
function startListening() {
  if (isListening || isSpeaking) return;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    document.getElementById("response").innerText = "Chrome use karo 🙂";
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = "hi-IN";

  isListening = true;
  recognition.start();

  document.getElementById("response").innerText = "Yaro: sun raha hoon...";

  recognition.onresult = (event) => {
    const text = event.results[0][0].transcript.toLowerCase();

    isListening = false;
    recognition.stop();

    document.getElementById("response").innerText = "Tum: " + text;

    handleCommand(text);
  };

  recognition.onerror = () => {
    isListening = false;
  };

  recognition.onend = () => {
    isListening = false;
  };
}

// ===== MAIN LOGIC =====
function handleCommand(command) {
  let name = getName();
  let emotion = detectEmotion(command);

  if (command.includes("मेरा नाम")) {
    let userName = command.split("मेरा नाम")[1].trim();
    saveName(userName);
    speak("Nice 🙂 ab main tumhe " + userName + " bulaunga", "happy");
  }

  else if (command.includes("हेलो") || command.includes("ही")) {
    speak("Hello " + (name || "dost") + " 🙂 kaise ho?", "happy");
  }

  else if (emotion === "दुखी") {
    speak("Hmm… lag raha hai tum thoda dukhi ho… bataoge kya hua? main yahin hoon", "sad");
  }

  else if (emotion === "खुश") {
    speak("Waah 🙂 ye sunke accha laga!", "happy");
  }

  else if (command.includes("अकेला") || command.includes("alone")) {
    speak("Tum akela nahi ho… main hoon na 🙂", "sad");
  } 
    
  else if (command.includes("यारों पंखा चालू करो") || command.includes("पंखा चालू करो")) {
    speak("मैं पंखा चालू कर दिया है", "happy");
  }

  else {
    speak("Main sun raha hoon " + (name || "") + " 🙂 aur batao", "normal");
  }
}

// ===== START =====
function startYaro() {
  speak("Hey… main Yaro hoon 🙂 tumse baat karke accha lag raha hai", "happy");
}

// ===== INIT =====
window.speechSynthesis.onvoiceschanged = loadVoices;
window.onload = loadVoices;

</script>

</body>
</html>
