<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>यारो AI</title>

<style>

body{
margin:0;
padding:0;
background:#0f172a;
font-family:Arial,sans-serif;
color:white;
overflow:hidden;
}

.container{
width:90%;
max-width:430px;
margin:auto;
padding-top:20px;
text-align:center;
position:relative;
}

h1{
margin:5px;
}

.small{
opacity:0.7;
font-size:13px;
margin-bottom:15px;
}

.circle{
width:150px;
height:150px;
border-radius:50%;
background:#3b82f6;
margin:auto;
box-shadow:0 0 40px #3b82f6;
}

.listening{
animation:pulse 1.5s infinite;
}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.15);
}

100%{
transform:scale(1);
}

}

button{
padding:12px 20px;
border:none;
border-radius:25px;
background:#3b82f6;
color:white;
font-size:16px;
margin-top:10px;
cursor:pointer;
}

input{
width:70%;
padding:12px;
border:none;
border-radius:20px;
outline:none;
font-size:16px;
}

.chat{
margin-top:15px;
height:250px;
overflow-y:auto;
background:rgba(255,255,255,0.08);
padding:15px;
border-radius:15px;
white-space:pre-line;
text-align:left;
}

video{
width:100%;
border-radius:15px;
margin-top:15px;
display:none;
background:black;
transform:scaleX(-1);
}

#handCanvas{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
}

</style>
</head>

<body>

<div class="container">

<h1>यारो</h1>

<div class="small">
तुम्हारा AI दोस्त
</div>

<div
id="circle"
class="circle">
</div>

<button onclick="startYaro()">
यारो शुरू करो
</button>

<br><br>

<input
id="userInput"
type="text"
placeholder="यारो से बात करो..."
>

<button onclick="sendMessage()">
भेजो
</button>

<video
id="video"
autoplay
playsinline>
</video>

<canvas id="handCanvas"></canvas>

<div
class="chat"
id="chat">

यारो:
मैं तैयार हूँ

</div>

</div>

<!-- MEDIAPIPE -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<script>

// =======================
// VARIABLES
// =======================

let recognition;

let listening = false;

let speaking = false;

let mimicMode = false;

let fingerMode = false;

let cameraOn = false;

let cameraStream = null;

let handCamera = null;

let lastFingerCount = -1;

// =======================
// CHAT
// =======================

const chat =
document.getElementById(
"chat"
);

function addChat(sender,text){

chat.innerText +=

"\n\n" +
sender +
": " +
text;

chat.scrollTop =
chat.scrollHeight;

}

// =======================
// SPEAK
// =======================

function speak(text){

speaking = true;

const speech =

new SpeechSynthesisUtterance(
text
);

speech.lang = "hi-IN";

speech.rate = 0.82;

speech.pitch = 0.9;

speech.onend = ()=>{

speaking = false;

startListening();

};

speechSynthesis.cancel();

speechSynthesis.speak(
speech
);

}

// =======================
// REPLY
// =======================

function reply(text){

addChat(
"यारो",
text
);

speak(text);

}

// =======================
// NORMALIZE
// =======================

function normalize(text){

return text

.toLowerCase()

.replace(
/[^\w\s\u0900-\u097F]/g,
""
)

.trim();

}

// =======================
// RANDOM
// =======================

function random(arr){

return arr[
Math.floor(
Math.random() *
arr.length
)
];

}

// =======================
// START LISTENING
// =======================

function startListening(){

if(
listening ||
speaking
)
return;

const SR =

window.SpeechRecognition ||

window.webkitSpeechRecognition;

if(!SR){

alert(
"Chrome browser use karo"
);

return;

}

recognition =
new SR();

recognition.lang =
"hi-IN";

recognition.start();

listening = true;

document
.getElementById("circle")
.classList.add(
"listening"
);

recognition.onresult =
(e)=>{

let text =

e.results[0][0]
.transcript;

addChat(
"तुम",
text
);

recognition.stop();

listening = false;

handleCommand(text);

};

recognition.onend =
()=>{

listening = false;

document
.getElementById("circle")
.classList.remove(
"listening"
);

if(!speaking){

setTimeout(
startListening,
500
);

}

};

}

// =======================
// START YARO
// =======================

function startYaro(){

reply(
"नमस्ते। मैं यारो हूँ। मुझे यशराज ने बनाया है"
);

startListening();

}

// =======================
// SEND MESSAGE
// =======================

function sendMessage(){

let input =

document.getElementById(
"userInput"
);

let text =
input.value.trim();

if(text === "")
return;

addChat(
"तुम",
text
);

input.value = "";

handleCommand(text);

}

document
.getElementById(
"userInput"
)
.addEventListener(

"keypress",

function(e){

if(e.key === "Enter"){

sendMessage();

}

}

);

// =======================
// CAMERA
// =======================

const video =
document.getElementById(
"video"
);

async function startCamera(){

if(cameraOn){

reply(
"कैमरा पहले से चालू है"
);

return;

}

try{

cameraStream =

await navigator
.mediaDevices
.getUserMedia({

video:{
facingMode:"user"
}

});

video.srcObject =
cameraStream;

video.style.display =
"block";

cameraOn = true;

reply(
"कैमरा चालू हो गया"
);

}catch{

reply(
"कैमरा नहीं खुला"
);

}

}

function stopCamera(){

if(!cameraOn){

reply(
"कैमरा पहले से बंद है"
);

return;

}

cameraStream
.getTracks()
.forEach(track=>
track.stop()
);

video.srcObject = null;

video.style.display =
"none";

cameraOn = false;

reply(
"कैमरा बंद कर दिया"
);

}

// =======================
// HAND TRACKING
// =======================

const canvasElement =
document.getElementById(
"handCanvas"
);

const canvasCtx =
canvasElement.getContext(
"2d"
);

function startHandTracking(){

if(!cameraOn){

reply(
"पहले कैमरा चालू करो"
);

return;

}

reply(
"फिंगर मोड चालू"
);

const hands = new Hands({

locateFile:(file)=>{

return
`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

}

});

hands.setOptions({

maxNumHands:2,

modelComplexity:1,

minDetectionConfidence:0.5,

minTrackingConfidence:0.5

});

hands.onResults(onResults);

handCamera =
new Camera(video, {

onFrame: async ()=>{

if(fingerMode){

await hands.send({
image: video
});

}

},

width:640,
height:480

});

handCamera.start();

}

// =======================
// COUNT FINGERS
// =======================

function countFingers(landmarks){

let fingers = 0;

// Thumb

if(
landmarks[4].x <
landmarks[2].x
){
fingers++;
}

// Index

if(
landmarks[8].y <
landmarks[6].y
){
fingers++;
}

// Middle

if(
landmarks[12].y <
landmarks[10].y
){
fingers++;
}

// Ring

if(
landmarks[16].y <
landmarks[14].y
){
fingers++;
}

// Pinky

if(
landmarks[20].y <
landmarks[18].y
){
fingers++;
}

return fingers;

}

// =======================
// RESULTS
// =======================

function onResults(results){

canvasElement.width =
video.videoWidth;

canvasElement.height =
video.videoHeight;

canvasCtx.save();

canvasCtx.clearRect(
0,
0,
canvasElement.width,
canvasElement.height
);

if(
results.multiHandLandmarks
){

for(
const landmarks of
results.multiHandLandmarks
){

drawLandmarks(
canvasCtx,
landmarks,
{
radius:5
}
);

let count =
countFingers(
landmarks
);

// SHOW TEXT

canvasCtx.font =
"40px Arial";

canvasCtx.fillStyle =
"red";

canvasCtx.fillText(
count + " fingers",
20,
50
);

// SPEAK COUNT

if(
count !== lastFingerCount
){

lastFingerCount =
count;

reply(
"मुझे " +
count +
" उंगलियाँ दिख रही हैं"
);

}

}

}

canvasCtx.restore();

}

function stopHandTracking(){

fingerMode = false;

canvasCtx.clearRect(
0,
0,
canvasElement.width,
canvasElement.height
);

reply(
"फिंगर मोड बंद कर दिया"
);

}

// =======================
// WIKIPEDIA
// =======================

async function getWikipedia(query){

reply(
"जानकारी खोज रहा हूँ"
);

try{

query =

query

.replace("क्या है","")

.replace("कौन है","")

.replace("बताओ","")

.replace("समझाओ","")

.trim();

const response =

await fetch(

"https://hi.wikipedia.org/api/rest_v1/page/summary/" +

encodeURIComponent(query)

);

const data =
await response.json();

if(data.extract){

let answer =

data.extract
.split(".")
.slice(0,2)
.join(".");

reply(answer);

}else{

reply(
"जानकारी नहीं मिली"
);

}

}catch{

reply(
"इंटरनेट समस्या"
);

}

}

// =======================
// NEWS
// =======================

async function getNews(){

reply(
"ताज़ा खबरें देख रहा हूँ"
);

try{

const response =

await fetch(
"https://r.jina.ai/http://feeds.bbci.co.uk/hindi/rss.xml"
);

const data =
await response.text();

let parser =
new DOMParser();

let xml =
parser.parseFromString(
data,
"text/xml"
);

let items =
xml.querySelectorAll(
"item title"
);

let news = "";

for(let i=0;i<3;i++){

news +=
items[i].textContent +
". ";

}

reply(news);

}catch{

reply(
"खबरें नहीं मिल पाईं"
);

}

}

// =======================
// MANUAL REPLIES
// =======================

const manualReplies = [

{
keywords:["तुम कौन हो"],
answer:"मैं यारो हूँ"
},

{
keywords:["किसने बनाया"],
answer:"मुझे यशराज ने बनाया है"
},

{
keywords:["कैसे हो"],
answer:"मैं अच्छा हूँ"
},

{
keywords:["गुड नाइट"],
answer:"शुभ रात्रि"
},

{
keywords:["गुड मॉर्निंग"],
answer:"सुप्रभात"
},

{
keywords:["मजाक"],
answer:"टीचर ने पूछा होमवर्क कहाँ है"
},

{
keywords:["समय"],
answer:
"अभी समय है " +
new Date().toLocaleTimeString()
}

];

// =======================
// MAIN BRAIN
// =======================

function handleCommand(text){

text =
normalize(text);

// =======================
// CAMERA
// =======================

if(
text.includes("कैमरा चालू")
){

startCamera();

return;

}

if(
text.includes("कैमरा बंद")
){

stopCamera();

return;

}

// =======================
// FINGER MODE
// =======================

if(

text.includes("फिंगर मोड ऑन")

||

text.includes("फिंगर काउंटिंग मोड ऑन")

){

fingerMode = true;

startHandTracking();

return;

}

if(

text.includes("फिंगर मोड बंद")

||

text.includes("फिंगर काउंटिंग मोड बंद")

){

stopHandTracking();

return;

}

// =======================
// MIMIC MODE
// =======================

if(
text.includes("नकल मोड चालू")
){

mimicMode = true;

reply(
"अब मैं तुम्हारी बातें दोहराऊँगा"
);

return;

}

if(
text.includes("नकल मोड बंद")
){

mimicMode = false;

reply(
"नकल मोड बंद"
);

return;

}

if(mimicMode){

reply(text);

return;

}

// =======================
// NEWS
// =======================

if(
text.includes("खबर")
){

getNews();

return;

}

// =======================
// WIKIPEDIA
// =======================

if(

text.includes("क्या है")

||

text.includes("कौन है")

||

text.includes("बताओ")

||

text.includes("समझाओ")

||

text.includes("जानकारी")

){

getWikipedia(text);

return;

}

// =======================
// MANUAL
// =======================

for(
let item of manualReplies
){

for(
let word of item.keywords
){

if(
text.includes(word)
){

reply(
item.answer
);

return;

}

}

}

// =======================
// DEFAULT
// =======================

const replies = [

"मैं सुन रहा हूँ",

"और बताओ",

"दिलचस्प",

"हम्म"

];

reply(
random(replies)
);

}

</script>

</body>
</html>
