<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yaro - AI Dost</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0f172a,#1e293b);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.container{
width:90%;
max-width:430px;
text-align:center;
}

h1{
margin-bottom:5px;
}

.small{
opacity:0.7;
font-size:13px;
margin-bottom:15px;
}

.circle{
width:150px;
height:150px;
border-radius:50%;
background:#3b82f6;
margin:20px auto;
box-shadow:0 0 40px #3b82f6;
transition:0.3s;
}

.listening{
animation:pulse 1.5s infinite;
}

@keyframes pulse{
0%{
transform:scale(1);
opacity:1;
}
50%{
transform:scale(1.2);
opacity:0.4;
}
100%{
transform:scale(1);
opacity:1;
}
}

button{
padding:14px 24px;
border:none;
border-radius:25px;
background:#3b82f6;
color:white;
font-size:16px;
cursor:pointer;
}

.chat{
margin-top:20px;
background:rgba(255,255,255,0.08);
padding:15px;
border-radius:15px;
height:260px;
overflow-y:auto;
text-align:left;
white-space:pre-line;
}

</style>
</head>

<body>

<div class="container">

<h1>Yaro 🎙️</h1>

<div class="small">
Tumhara AI Dost 🙂
</div>

<div id="circle" class="circle"></div>

<button onclick="startYaro()">
Start Yaro
</button>
<br><br>

<input
id="userInput"
type="text"
placeholder="Yaro se baat karo..."
style="
width:70%;
padding:12px;
border:none;
border-radius:20px;
outline:none;
font-size:16px;
">
<video 
id="video"
autoplay
playsinline
style="
width:100%;
border-radius:15px;
margin-top:15px;
display:block;
background:black;

">
</video>
<button onclick="sendMessage()">
Send
</button> 
<div class="chat" id="chat">
Yaro: Main yahin hoon 🙂
</div>

</div>

<script>
// =======================
// SHAKE DETECTION
// =======================

let lastX = 0;
let lastY = 0;
let lastZ = 0;

window.addEventListener(
"devicemotion",
(event)=>{

let acc =
event.accelerationIncludingGravity;

if(!acc) return;

let x = acc.x;
let y = acc.y;
let z = acc.z;

let movement =
Math.abs(x-lastX) +
Math.abs(y-lastY) +
Math.abs(z-lastZ);

if(movement > 25){

if(!speaking){

reply(
"Arre 😄 itna kyun hila rahe ho?"
);

}

}

lastX = x;
lastY = y;
lastZ = z;

}
);
// =======================
// VARIABLES
// =======================

let recognition;
let listening = false;
let speaking = false;

// =======================
// MEMORY
// =======================

let memory =
JSON.parse(
localStorage.getItem("yaro_memory")
) || {

name:"",
mood:"",
likes:[],
customReplies:{}

};

// =======================
// SAVE MEMORY
// =======================

function saveMemory(){

localStorage.setItem(
"yaro_memory",
JSON.stringify(memory)
);

}

// =======================
// CHAT
// =======================

const chat =
document.getElementById("chat");

function addChat(sender,text){

chat.innerText +=
"\n\n" + sender + ": " + text;

chat.scrollTop =
chat.scrollHeight;

}

// =======================
// NORMALIZE HINDI
// =======================

function normalizeText(text){

text = text.toLowerCase();

const replacements = {

"हेलो":"hello",
"हाय":"hi",
"नमस्ते":"namaste",

"दुखी":"sad",
"उदास":"sad",
"मूड ऑफ":"mood off",

"अकेला":"alone",

"पढ़ाई":"study",
"एग्जाम":"exam",

"समय":"time",
"तारीख":"date",

"मजाक":"joke",

"प्रेरणा":"motivation",

"धन्यवाद":"thank you"

};

for(let key in replacements){

text =
text.replaceAll(
key,
replacements[key]
);

}

text =
text.replace(/[^\w\s]/gi,"");

text =
text.trim();

return text;

}

// =======================
// RANDOM
// =======================

function random(arr){

return arr[
Math.floor(
Math.random()*arr.length
)
];

}

// =======================
// SMART MATCH
// =======================

function hasWords(text,words){

text =
normalizeText(text);

for(let word of words){

if(
text.includes(
word.toLowerCase()
)
){

return true;

}

}

return false;

}

// =======================
// REPLIES
// =======================

const emotionalReplies = [

"Main yahin hoon 🙂",
"Sab theek ho jayega 🙂",
"Thoda aur bataoge?",
"Kabhi kabhi life tough lagti hai 🙂"

];

const happyReplies = [

"Waah 🙂",
"Bahut badhiya 🙂",
"Nice 🙂"

];

const defaultReplies = [

"Main sun raha hoon 🙂",
"aur bataao 🙂",
"Hmm 🙂",
"Interesting 🙂"

];

// =======================
// SPEAK
// =======================

function speak(text){

speaking = true;

const speech =
new SpeechSynthesisUtterance(text);

speech.lang = "hi-IN";

speech.pitch = 1;
speech.rate = 1;

speech.onend = ()=>{

speaking = false;

startListening();

};

speechSynthesis.cancel();

speechSynthesis.speak(speech);

}

// =======================
// START LISTENING
// =======================

function startListening(){

if(listening || speaking)
return;

const SR =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SR){

alert(
"Chrome browser use karo 🙂"
);

return;

}

recognition =
new SR();

recognition.lang = "hi-IN";

recognition.start();

listening = true;

document
.getElementById("circle")
.classList.add("listening");

recognition.onresult = (e)=>{

let text =
e.results[0][0]
.transcript;

addChat(
"Tum",
text
);

listening = false;

recognition.stop();

handleCommand(text);

};

recognition.onerror = ()=>{

listening = false;

setTimeout(
startListening,
1000
);

};

recognition.onend = ()=>{

listening = false;

if(!speaking){

setTimeout(
startListening,
500
);

}

};

}

// =======================
// REPLY
// =======================

function reply(text){

addChat(
"Yaro",
text
);

speak(text);

}

// =======================
// MAIN BRAIN
// =======================

function handleCommand(text){
let cameraOn = false;
let cameraStream = null;
let lastInteraction = Date.now();

lastInteraction =
Date.now();

text =
normalizeText(text);

// =======================
// CUSTOM LEARNING
// =======================

// Example:
// yaad rakho hello ka jawab hey dost
if(
text.includes("camera off")
){

stopCamera();

return;

}
if(
text.includes("camera on")
){

startCamera();

return;

}
if(
text.includes("yaad rakho")
){

try{

let parts =
text.replace(
"yaad rakho",
""
).split(
"ka jawab"
);

let question =
parts[0].trim();

let answer =
parts[1].trim();

memory.customReplies[
question
] = answer;

saveMemory();

reply(
"Okay 🙂 maine yaad rakh liya"
);

}catch{

reply(
"Thoda alag tareeke se bolo 🙂"
);

}

return;

}

// =======================
// CUSTOM REPLIES
// =======================

for(let key in memory.customReplies){

if(
text.includes(key)
){

reply(
memory.customReplies[key]
);

return;

}

}

// =======================
// NAME MEMORY
// =======================

if(
text.includes("मेरा नाम")
){

let name =
text.replace(
"मेरा नाम",
""
).trim();

memory.name = name;

saveMemory();

reply(
"Nice 🙂 ab main tumhe " +
name +
" bulaunga"
);

return;

}

// =======================
// LIKES MEMORY
// =======================

if(
text.includes("मुझे") &&
text.includes("पसंद है")
){

let like =
text
.replace(
"मुझे",
""
)
.replace(
"पसंद है",
""
)
.trim();

memory.likes.push(like);

saveMemory();

reply(
"Accha 🙂 tumhe " +
like +
" pasand hai"
);

return;

}

// =======================
// ASK LIKES
// =======================

if(
text.includes(
"मुझे क्या पसंद है"
)
){

if(
memory.likes.length > 0
){

reply(
"Tumhe " +
memory.likes.join(", ") +
" pasand hai 🙂"
);

}else{

reply(
"Abhi mujhe nahi pata 🙂"
);

}

return;

}

// =======================
// HELLO
// =======================

if(
hasWords(
text,
[
"hello",
"hi",
"hey",
"namaste"
]
)
){

reply(
"Hello " +
(memory.name || "dost") +
" 🙂 kaise ho?"
);

return;

}

// =======================
// SAD
// =======================

if(
hasWords(
text,
[
"sad",
"dukhi",
"mood off",
"acha nahi lag raha"
]
)
){

memory.mood = "sad";

saveMemory();

reply(
random(
emotionalReplies
)
);

return;

}

// =======================
// HAPPY
// =======================

if(
hasWords(
text,
[
"happy",
"khush",
"mast",
"accha lag raha"
]
)
){

memory.mood = "happy";

saveMemory();

reply(
random(
happyReplies
)
);

return;

}

// =======================
// ALONE
// =======================

if(
hasWords(
text,
[
"akela",
"alone",
"lonely"
]
)
){

reply(
"Tum akela nahi ho 🙂"
);

return;

}

// =======================
// TIME
// =======================

if(
hasWords(
text,
[
"time",
"samay"
]
)
){

let time =
new Date()
.toLocaleTimeString();

reply(
"Abhi time hai " +
time
);

return;

}

// =======================
// DATE
// =======================

if(
hasWords(
text,
[
"date",
"aaj ki date"
]
)
){

let date =
new Date()
.toLocaleDateString();

reply(
"Aaj ki date hai " +
date
);

return;

}

// =======================
// JOKE
// =======================

if(
text.includes("joke")
){

reply(
"Teacher ne pucha homework kyu nahi kiya 🙂 student bola network problem tha"
);

return;

}

// =======================
// MOTIVATION
// =======================

if(
hasWords(
text,
[
"motivate",
"motivation"
]
)
){

reply(
"Har bada kaam chhoti shuruaat se hota hai 🙂"
);

return;

}

// =======================
// STUDY
// =======================

if(
hasWords(
text,
[
"study",
"padhai",
"exam"
]
)
){

reply(
"Consistency hi success ki key hoti hai 🙂"
);

return;

}

// =======================
// THANK YOU
// =======================

if(
hasWords(
text,
[
"thank you",
"shukriya"
]
)
){

reply(
"Arey 🙂 itni formal mat bano"
);

return;

}

// =======================
// DEFAULT
// =======================

reply(
random(
defaultReplies
)
);

}

// =======================
// START
// =======================

function startYaro(){

let welcome =
"Hey 🙂 main Yaro hoon. Tumse baat karke accha lag raha hai.";

addChat(
"Yaro",
welcome
);

speak(
welcome
);
  }
// =======================
// SEND TYPED MESSAGE
// =======================

function sendMessage(){

let input =
document
.getElementById("userInput");

let text =
input.value.trim();

if(text === "") return;

addChat("Tum", text);

input.value = "";

handleCommand(text);

}
// =======================
// ENTER KEY SUPPORT
// =======================

document
.getElementById("userInput")
.addEventListener(
"keypress",
function(e){

if(e.key === "Enter"){

sendMessage();

}

} 
);
// =======================
// IDLE TALKS
// =======================

const idleReplies = [

"Itne chup kyun ho 🙂",

"Aaj ka din kaisa tha 🙂",

"Music sun rahe ho kya 😄",

"Main bore ho raha hoon 🙂",

"Kabhi kabhi random baatein bhi acchi hoti hain 🙂",

"Pani piya kya 🙂"

];

setInterval(()=>{

let now = Date.now();

let idleTime =
(now - lastInteraction) / 1000;

if(
idleTime > 40 &&
!speaking &&
!listening
){

lastInteraction =
Date.now();

reply(
random(idleReplies)
);

}

},5000);
// =======================
// LIGHT SENSOR
// =======================

if(
'AmbientLightSensor' in window
){

try{

const sensor =
new AmbientLightSensor();

sensor.addEventListener(
'reading',
()=>{

let light =
sensor.illuminance;

// DARK

if(light < 10){

reply(
"Lights off 🙂 relax mode?"
);

}

// BRIGHT

else if(light > 1000){

reply(
"Bahaar ho kya 🙂"
);

}

});

sensor.start();

}catch(err){

console.log(
"Light sensor error"
);

}

}
// =======================
// MOTION DETECTION
// =======================

let motionCooldown = false;

function detectMotion(){

const canvas =
document.createElement("canvas");

const ctx =
canvas.getContext("2d");

let lastData = null;

setInterval(()=>{

if(video.videoWidth === 0)
return;

canvas.width =
video.videoWidth;

canvas.height =
video.videoHeight;

ctx.drawImage(
video,
0,
0
);

let frame =
ctx.getImageData(
0,
0,
canvas.width,
canvas.height
);

if(lastData){

let diff = 0;

for(
let i=0;
i<frame.data.length;
i+=40
){

diff += Math.abs(
frame.data[i] -
lastData.data[i]
);

}

if(
diff > 50000 &&
!motionCooldown
){

motionCooldown = true;

reply(
"Hello 😄 haath hila rahe ho?"
);

setTimeout(()=>{

motionCooldown = false;

},5000);

}

}

lastData = frame;

},1000);

}

// =======================
// START CAMERA
// =======================
async function startCamera(){

if(cameraOn){

reply(
"Camera already on 🙂"
);

return;

}

try{

cameraStream =
await navigator.mediaDevices.getUserMedia({
video:true
});

video.srcObject =
cameraStream;

video.style.display =
"block";

cameraOn = true;

reply(
"Camera on 😄"
);

detectMotion();

}catch{

reply(
"Camera access nahi mila 🙂"
);

}

  }
// =======================
// STOP CAMERA
// =======================

function stopCamera(){

if(!cameraOn){

reply(
"Camera already off 🙂"
);

return;

}

cameraStream
.getTracks()
.forEach(track=>track.stop());

video.srcObject = null;

video.style.display =
"none";

cameraOn = false;

reply(
"Camera off 🙂");

  }
</script>

</body>
</html>
