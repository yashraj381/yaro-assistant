  <script>

  const responseParagraph = document.getElementById('response');

const pitchSlider = document.getElementById('pitch');

let selectedVoice = null;

// Function to speak text with emotion

function speak(text, emotion) {

    const speech = new SpeechSynthesisUtterance(text);

    speech.voice = selectedVoice; // Set the selected voice

    

    // Adjust pitch and rate based on emotion

    if (emotion === 'happy') {

        speech.pitch = 1.5; // Higher pitch for happy tone

        speech.rate = 0.8; // Slightly faster rate

    } else if (emotion === 'sad') {

        speech.pitch = 0.8; // Lower pitch for sad tone

        speech.rate = 0.8; // Slower rate

    } else {

        speech.pitch = parseFloat(pitchSlider.value); // Default pitch

        speech.rate = 1; // Default rate

    }

    

    window.speechSynthesis.speak(speech);

}

// Function to listen for voice commands

function listen() {

    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();

    recognition.lang = 'hi-IN'; // Set language to Hindi

    recognition.interimResults = false;

    recognition.onstart = () => {

        responseParagraph.textContent = "सुन रहा हूँ...";

    };

    recognition.onresult = (event) => {

        const command = event.results[0][0].transcript.toLowerCase();

        responseParagraph.textContent = `आपने कहा: ${command}`;

        handleCommand(command);

    };

    recognition.onerror = (event) => {

        responseParagraph.textContent = "पहचान में त्रुटि: " + event.error;

    };

    recognition.onend = () => {

        responseParagraph.textContent = "सुनना बंद कर दिया। फिर से शुरू कर रहा हूँ...";

        listen(); // Restart listening after it ends

    };

    recognition.start();

}
