<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yaro Face Recognition</title>

<script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>
body {
    background: #080d18;
    color: white;
    font-family: Arial;
    text-align: center;
    padding: 20px;
}

h1 { color: #00e5ff; }

video {
    width: 100%;
    max-width: 400px;
    border: 2px solid #00e5ff;
    border-radius: 15px;
    transform: scaleX(-1);
}

button {
    padding: 14px 20px;
    margin: 8px;
    border: none;
    border-radius: 10px;
    background: #00c8e8;
    color: #001018;
    font-weight: bold;
    font-size: 15px;
}

#status {
    margin-top: 20px;
    font-size: 18px;
    color: #00e5ff;
}

</style>
</head>

<body>

<h1>🤖 YARO VISION</h1>
<p>Face Recognition System</p>

<video id="video" autoplay muted playsinline></video>

<br><br>

<button onclick="startCamera()">START CAMERA</button>

<button onclick="registerFace()">REGISTER MY FACE</button>

<button onclick="recognizeFace()">AM I YASHRAJ?</button>

<div id="status">Loading AI Models...</div>

<script>

const video = document.getElementById("video");
const statusText = document.getElementById("status");

let registeredFace = null;
let modelsReady = false;

const MODEL_URL =
"https://justadudewhohacks.github.io/face-api.js/models";

async function loadModels() {
    try {
        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
        await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
        await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

        modelsReady = true;
        statusText.innerText = "AI Ready! Start Camera.";
    }
    catch(error) {
        statusText.innerText = "Model loading failed. Check internet.";
        console.error(error);
    }
}

async function startCamera() {

    if(!modelsReady) {
        statusText.innerText = "Please wait for AI models.";
        return;
    }

    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" },
            audio: false
        });

        video.srcObject = stream;
        statusText.innerText = "Camera Started!";
    }
    catch(error) {
        statusText.innerText = "Camera permission denied!";
    }
}

async function getFace() {

    if(!video.srcObject) {
        statusText.innerText = "Start camera first!";
        return null;
    }

    const result = await faceapi
        .detectSingleFace(
            video,
            new faceapi.TinyFaceDetectorOptions()
        )
        .withFaceLandmarks()
        .withFaceDescriptor();

    if(!result) {
        statusText.innerText = "No face detected!";
        return null;
    }

    return result.descriptor;
}

async function registerFace() {

    const descriptor = await getFace();

    if(!descriptor) return;

    registeredFace = Array.from(descriptor);

    statusText.innerText =
        "Face Registered! Hello Yashraj.";

}

async function recognizeFace() {

    if(!registeredFace) {
        statusText.innerText =
            "First register your face!";
        return;
    }

    const currentFace = await getFace();

    if(!currentFace) return;

    const distance = faceapi.euclideanDistance(
        new Float32Array(registeredFace),
        currentFace
    );

    if(distance < 0.6) {

        statusText.innerText =
            "✓ Hello Yashraj! I recognize you.";

        speak("Hello Yashraj! Welcome back.");

    } else {

        statusText.innerText =
            "Unknown Person! Face not matched.";

    }

}

function speak(message) {

    const speech = new SpeechSynthesisUtterance(message);
    speech.lang = "en-IN";
    speechSynthesis.speak(speech);

}

loadModels();

</script>

</body>
</html>
