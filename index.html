// =======================
// VARIABLES
// =======================

let recognition;

let listening = false;

let speaking = false;

let mimicMode = false;

let lastInteraction =
Date.now();

let cameraOn = false;

let cameraStream = null;

let motionInterval = null;

let motionCooldown = false;

let fingerMode = false;
// =======================
// MEMORY
// =======================

let memory =

JSON.parse(
localStorage.getItem(
"yaro_memory"
)
)

||

{

name:"",
likes:[],
customReplies:{}

};

// =======================
// SAVE MEMORY
// =======================

function saveMemory(){

localStorage.setItem(
"yaro_memory",
JSON.stringify(memory)
);

}

// =======================
// CHAT
// =======================

const chat =
document.getElementById(
"chat"
);

function addChat(sender,text){

chat.innerText +=

"\n\n" +
sender +
": " +
text;

chat.scrollTop =
chat.scrollHeight;

}

// =======================
// RANDOM
// =======================

function random(arr){

return arr[
Math.floor(
Math.random() *
arr.length
)
];

}

// =======================
// NORMALIZE
// =======================

function normalizeText(text){

text =
text.toLowerCase();

text =
text.replace(
/[^\w\s\u0900-\u097F]/g,
""
);

return text.trim();

}

// =======================
// REMOVE EMOJI
// =======================

function cleanSpeakText(text){

return text

.replace(
/[\u{1F600}-\u{1F64F}]/gu,
""
)

.replace(
/[\u{1F300}-\u{1F5FF}]/gu,
""
)

.replace(
/[\u{1F680}-\u{1F6FF}]/gu,
""
);

}

// =======================
// SPEAK
// =======================

function speak(text){

speaking = true;

let cleanText =
cleanSpeakText(text);

const speech =

new SpeechSynthesisUtterance(
cleanText
);

speech.lang = "hi-IN";

speech.pitch = 0.9;

speech.rate = 0.78;

speech.volume = 1;

speech.onend = ()=>{

speaking = false;

startListening();

};

speechSynthesis.cancel();

speechSynthesis.speak(
speech
);

}

// =======================
// REPLY
// =======================

function reply(text){

addChat(
"यारो",
text
);

speak(text);

}

// =======================
// START LISTENING
// =======================

function startListening(){

if(
listening ||
speaking
)
return;

const SR =

window.SpeechRecognition ||

window.webkitSpeechRecognition;

if(!SR){

alert(
"क्रोम ब्राउज़र इस्तेमाल करो"
);

return;

}

recognition =
new SR();

recognition.lang =
"hi-IN";

recognition.start();

listening = true;

document
.getElementById("circle")
.classList.add(
"listening"
);

recognition.onresult =
(e)=>{

let text =

e.results[0][0]
.transcript;

addChat(
"तुम",
text
);

listening = false;

recognition.stop();

handleCommand(text);

};

recognition.onerror =
()=>{

listening = false;

document
.getElementById("circle")
.classList.remove(
"listening"
);

setTimeout(
startListening,
1000
);

};

recognition.onend =
()=>{

listening = false;

document
.getElementById("circle")
.classList.remove(
"listening"
);

if(!speaking){

setTimeout(
startListening,
500
);

}

};

}

// =======================
// START YARO
// =======================

function startYaro(){

let hour =
new Date().getHours();

let greet = "";

if(hour < 12){

greet =
"सुप्रभात";

}

else if(hour < 18){

greet =
"नमस्ते";

}

else{

greet =
"शुभ संध्या";

}

reply(
greet +
" मैं यारो हूँ। मुझे यशराज ने बनाया है।"
);

}

// =======================
// SEND MESSAGE
// =======================

function sendMessage(){

let input =

document.getElementById(
"userInput"
);

let text =
input.value.trim();

if(text === "")
return;

addChat(
"तुम",
text
);

input.value = "";

handleCommand(text);

}

// =======================
// ENTER SUPPORT
// =======================

document

"userInput"

.addEventListener(

"keypress",

function(e){

if(e.key === "Enter"){

async function startCamera(){

if(cameraOn){

reply(
"कैमरा पहले से चालू है"
);

return;

}

try{

cameraStream =

await navigator
.mediaDevices
.getUserMedia({

video:true

});

video.srcObject =
cameraStream;

video.style.display =
"block";

cameraOn = true;

reply(
"कैमरा चालू हो गया"
);

detectMotion();

}catch{

reply(
"कैमरा नहीं खुला"
);

}

}

function stopCamera(){

if(!cameraOn){

reply(
"कैमरा पहले से बंद है"
);

return;

}

cameraStream
.getTracks()
.forEach(track=>
track.stop()
);

video.srcObject = null;

video.style.display =
"none";

cameraOn = false;

clearInterval(
motionInterval
);

reply(
"कैमरा बंद कर दिया"
);

}

// =======================
// MOTION DETECTION
// =======================

function detectMotion(){

clearInterval(
motionInterval
);

const canvas =
document.createElement(
"canvas"
);

const ctx =
canvas.getContext("2d");

let lastData = null;

motionInterval =
setInterval(()=>{

if(
!cameraOn ||
video.videoWidth === 0
)
return;

if(fingerMode)
return;
  
canvas.width =
video.videoWidth;

canvas.height =
video.videoHeight;

ctx.drawImage(
video,
0,
0
);

let frame =
ctx.getImageData(
0,
0,
canvas.width,
canvas.height
);

if(lastData){

let diff = 0;

for(
let i=0;
i<frame.data.length;
i+=40
){

diff +=

Math.abs(
frame.data[i] -
lastData.data[i]
);

}

if(

diff > 300000 &&

diff < 2000000 &&

!motionCooldown

){

motionCooldown =
true;

reply(
"हेलो, हाथ हिला रहे हो क्या"
);

setTimeout(()=>{

motionCooldown =
false;

},10000);

}

}

lastData = frame;

},1000);

}

// =======================
// SHAKE DETECTION
// =======================

let lastX = 0;
let lastY = 0;
let lastZ = 0;

window.addEventListener(

"devicemotion",

(event)=>{

let acc =
event.accelerationIncludingGravity;

if(!acc) return;

let x = acc.x;
let y = acc.y;
let z = acc.z;

let movement =

Math.abs(x-lastX) +

Math.abs(y-lastY) +

Math.abs(z-lastZ);

if(
movement > 25 &&
!speaking
){

reply(
"अरे, इतना क्यों हिला रहे हो"
);

}

lastX = x;
lastY = y;
lastZ = z;

}

);

setInterval(()=>{

let now =

let idleTime =

if(

}

async function getWikipediaAnswer(query){

reply(
"जानकारी खोज रहा हूँ"
);

try{

query =

query

.replace("क्या है","")

.replace("कौन है","")

.trim();

const response =

await fetch(

"https://hi.wikipedia.org/api/rest_v1/page/summary/" +

encodeURIComponent(query)

);

const data =
await response.json();

if(data.extract){

let answer =

data.extract
.split(".")[0];

reply(answer);

}else{

reply(
"मुझे जानकारी नहीं मिली"
);

}

}catch{

reply(
"जानकारी नहीं मिल पाई"
);

}

}

async function getNews(){

reply(
"ताज़ा खबरें देख रहा हूँ"
);

try{

const response =

await fetch(
"https://r.jina.ai/http://feeds.bbci.co.uk/hindi/rss.xml"
);

const data =
await response.text();

let parser =
new DOMParser();

let xml =
parser.parseFromString(
data,
"text/xml"
);

let items =
xml.querySelectorAll(
"item title"
);

let news = "";

for(let i=0;i<3;i++){

news +=
"खबर " +
(i+1) +
"। " +
items[i].textContent +
". ";

}

reply(news);

}catch{

reply(
"अभी खबरें नहीं मिल पाईं"
);

}

}

// =======================
// MAIN BRAIN
// =======================

function handleCommand(text){

lastInteraction =
Date.now();

text =
normalizeText(text);
// =========================
// FINGER MODE ON
// =========================

if(

text.includes("फिंगर काउंटिंग मोड ऑन")

||

text.includes("फिंगर मोड ऑन")

){

fingerMode = true;

startHandTracking();

reply(
"फिंगर काउंटिंग मोड चालू कर दिया"
);

return;

}

// =========================
// FINGER MODE OFF
// =========================

if(

text.includes("फिंगर काउंटिंग मोड बंद")

||

text.includes("फिंगर मोड बंद")

){

fingerMode = false;

stopHandTracking();

reply(
"फिंगर काउंटिंग मोड बंद कर दिया"
);

return;

  }
// =======================
// MIMIC MODE OFF
// =======================

if(

text.includes("नकल मोड बंद")

||

text.includes("मिमिक मोड बंद")

){

mimicMode = false;

reply(
"ठीक है। नकल मोड बंद कर दिया"
);

return;

}

// =======================
// MIMIC MODE ON
// =======================

if(

text.includes("नकल मोड चालू")

||

text.includes("मिमिक मोड चालू")

){

mimicMode = true;

reply(
"ठीक है। अब मैं तुम्हारी बातें दोहराऊँगा"
);

return;

}

// =======================
// MIMIC REPEAT
// =======================

if(mimicMode){

reply(text);

return;

}

// =======================
// CAMERA
// =======================

if(
text.includes("कैमरा चालू")
||

text.includes("कैमरा ऑन")
){

startCamera();

return;

}

if(
text.includes("कैमरा बंद")
||

text.includes("कैमरा ऑफ")
){

stopCamera();

return;

}

// =======================
// NEWS
// =======================

if(

text.includes("खबर")

||

text.includes("न्यूज़")

||

text.includes("समाचार")

){

getNews();

return;

}

// =======================
// WIKIPEDIA
// =======================

if(

text.includes("क्या है")

||

text.includes("कौन है")

){

getWikipediaAnswer(text);

return;

}

// =======================
// MEMORY LEARNING
// =======================

if(
text.includes("याद रखो")
){

try{

let parts =

text
.replace(
"याद रखो",
""
)
.split(
"का जवाब"
);

let question =
parts[0].trim();

let answer =
parts[1].trim();

memory.customReplies[
question
] = answer;

saveMemory();

reply(
"ठीक है। याद रख लिया"
);

}catch{

reply(
"थोड़ा अलग तरीके से बोलो"
);

}

return;

}

// =======================
// CUSTOM MEMORY
// =======================

for(
let key in
memory.customReplies
){

if(
text.includes(key)
){

reply(
memory.customReplies[
key
]
);

return;

}

}

// =======================
// SMART REPLIES
// =======================

for(
let item of manualReplies
){

for(
let word of item.keywords
){

if(
text.includes(word)
){

reply(
item.answer
);

return;

}

}

}

// =========================

// =========================

function startHandTracking(){

if(!cameraOn){

reply(
"पहले कैमरा चालू करो"
);

return;

}

reply(
"उंगलियाँ पहचान रहा हूँ"
);

const hands = new Hands({

locateFile:(file)=>{

return
`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

}

});

hands.setOptions({

maxNumHands:1,

modelComplexity:1,

minDetectionConfidence:0.7,

minTrackingConfidence:0.7

});

hands.onResults(onResults);

const camera = new Camera(video, {

onFrame: async ()=>{

if(fingerMode){

await hands.send({
image: video
});

}

},

width:640,
height:480

});

camera.start();

}

// =========================
// COUNT FINGERS
// =========================

function countFingers(landmarks){

let fingers = 0;

// Thumb

if(
landmarks[4].x <
landmarks[3].x
){

fingers++;

}

// Index

if(
landmarks[8].y <
landmarks[6].y
){

fingers++;

}

// Middle

if(
landmarks[12].y <
landmarks[10].y
){

fingers++;

}

// Ring

if(
landmarks[16].y <
landmarks[14].y
){

fingers++;

}

// Pinky

if(
landmarks[20].y <
landmarks[18].y
){

fingers++;

}

return fingers;

}

// =========================
// RESULTS
// =========================

function onResults(results){

canvasElement.width =
video.videoWidth;

canvasElement.height =
video.videoHeight;

canvasCtx.save();

canvasCtx.clearRect(
0,
0,
canvasElement.width,
canvasElement.height
);

if(
results.multiHandLandmarks
){

for(
const landmarks of
results.multiHandLandmarks
){

drawConnectors(
canvasCtx,
landmarks,
HAND_CONNECTIONS
);

drawLandmarks(
canvasCtx,
landmarks
);

let count =
countFingers(
landmarks
);

if(
count !== lastFingerCount
){

lastFingerCount =
count;

reply(
"मुझे " +
count +
" उंगलियाँ दिख रही हैं"
);

}

}

}

canvasCtx.restore();

}

// =========================
// STOP HAND TRACKING
// =========================

function stopHandTracking(){

reply(
"उंगली पहचान बंद कर दी"
);

  }  
  
</script>
