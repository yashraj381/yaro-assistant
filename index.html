<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yaro Voice Assistant</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #0f172a;
      color: white;
      margin-top: 50px;
    }

    .container {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      display: inline-block;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      border-radius: 20px;
      border: none;
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>Yaro 🤖</h1>
  <p id="response">Yaro: main sun raha hoon 🙂</p>

  <button onclick="startYaro()">Start Talking 🎤</button>
</div>

<script>

let selectedVoice = null;

// 🔊 VOICE SETUP
function loadVoices() {
  const voices = speechSynthesis.getVoices();
  selectedVoice = voices.find(v => v.lang.includes('hi')) || voices[0];
}

// 🗣️ SPEAK FUNCTION
function speak(text, emotion = "normal", callback) {
  const speech = new SpeechSynthesisUtterance(text);

  speech.voice = selectedVoice;
  speech.lang = "hi-IN";

  if (emotion === "happy") {
    speech.pitch = 1.3;
    speech.rate = 1;
  } else if (emotion === "sad") {
    speech.pitch = 0.8;
    speech.rate = 0.9;
  } else {
    speech.pitch = 1;
    speech.rate = 1;
  }

  speech.onend = () => {
    if (callback) callback();
  };

  speechSynthesis.cancel();
  speechSynthesis.speak(speech);
}

// 🎤 LISTEN FUNCTION
function startListening() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    document.getElementById("response").innerText = "Chrome browser use karo 🙂";
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "hi-IN";

  recognition.start();

  document.getElementById("response").innerText = "Yaro: sun raha hoon...";

  recognition.onresult = (event) => {
    const text = event.results[0][0].transcript.toLowerCase();

    document.getElementById("response").innerText = "Tum: " + text;

    handleCommand(text);
  };

  recognition.onerror = () => {
    setTimeout(startListening, 1000);
  };

  recognition.onend = () => {
    // auto restart
    setTimeout(startListening, 500);
  };
}

// 🧠 MAIN LOGIC (तुम यहाँ else-if डालना)
function handleCommand(command) {

  if (command.includes("नमस्ते")) {
    speak("नमस्ते! मैं यारो हूँ 🙂", "happy", startListening);

  } else if (command.includes("कैसे हो")) {
    speak("मैं ठीक हूँ… तुम बताओ 🙂", "happy", startListening);

  }

  // 👇👇👇
  // 👉 यहाँ तुम अपने सारे else-if डालना
  // 👇👇👇

  else {
    speak("मैं सुन रहा हूँ… और बताओ 🙂", "normal", startListening);
  }
}

// 🚀 START BUTTON
function startYaro() {
  speak("Hey… main Yaro hoon 🙂 tumse baat karke accha lag raha hai", "happy", startListening);
}

// INIT
window.speechSynthesis.onvoiceschanged = loadVoices;
window.onload = loadVoices;

</script>

</body>
</html>
